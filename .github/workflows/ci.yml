name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Run SignalProcessor unit tests (21 tests)
        run: npm test
      - name: Verify recorded sample trace and SDK privacy invariants
        run: npm run verify-trace
      - name: Build frontend bundle
        run: npm run build
